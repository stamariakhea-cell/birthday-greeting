<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage" id="stage">
  <div class="stars" id="stars"></div>
  <div class="hearts" id="hearts"></div>

  <div class="eyebrow">a little something for you</div>
  <h1 class="glow-title">Happy 18th Birthday<span id="nameOut">Ms. Antonette🎉</span></h1>
  <p class="sub">Wishing you a day as wonderful as you are — and a year ahead full of good surprises.</p>

  <form class="namebar" id="nameForm">
    <input type="text" id="nameInput" placeholder="Type a name…" maxlength="24" aria-label="Name of the birthday person">
    <button type="submit">Make it personal</button>
  </form>

  <!-- gift box surprise -->
  <div class="gift-wrap">
    <div class="gift" id="gift">
      <div class="gift-lid"></div>
      <div class="gift-box"></div>
      <div class="ribbon-v"></div>
      <div class="ribbon-h"></div>
      <div class="bow"></div>
    </div>
    <div class="gift-message" id="giftMessage">tap the gift for a little surprise </div>
  </div>

  <div class="cake-wrap">
    <div class="cake" id="cake">
      <div class="smoke"></div>
      <div class="flame"></div>
      <div class="wick"></div>
      <div class="candle"></div>
      <div class="tier1"></div>
      <div class="tier2"></div>
    </div>
    <div class="plate"></div>
    <div class="hint" id="hint">tap the candle to make a wish 🕯️</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
